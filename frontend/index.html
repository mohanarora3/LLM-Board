<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Panchayat</title>
  <meta name="description" content="Five AI search engines answer, then debate each other until they agree. You get one verdict." />
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/app.css" />
  <script>
    try { document.documentElement.dataset.theme = localStorage.getItem("panchayat.theme") || "dark"; } catch (e) { document.documentElement.dataset.theme = "dark"; }
  </script>
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Navigation">
      <div class="sb-head">
        <a class="brand" href="#/" aria-label="Panchayat home">
          <img src="assets/logo.svg" alt="" width="28" height="28" />
          <span class="brand-word label">panchayat</span>
        </a>
        <div class="sb-head-tools">
          <a class="icon-btn label" href="#/library" aria-label="Search your threads" data-icon="search"></a>
          <button class="icon-btn sb-collapse" id="collapseSidebar" aria-label="Collapse sidebar" data-icon="panel-left"></button>
        </div>
      </div>

      <nav class="sb-nav">
        <button class="sb-link sb-new" id="newThread" type="button"><span class="new-dot" data-icon="plus"></span><span class="label">New</span>
          <span class="kbd label"><kbd id="modKey">Ctrl</kbd><kbd>K</kbd></span></button>
        <a href="#/" class="sb-link" data-route="home"><span data-icon="scale"></span><span class="label">Council</span></a>
        <a href="#/library" class="sb-link" data-route="library"><span data-icon="library"></span><span class="label">Library</span></a>
      </nav>

      <button class="sb-section label" id="sessionsToggle" type="button" aria-expanded="true">
        <span>Sessions</span><span data-icon="chevron-down"></span>
      </button>
      <ul class="sb-threads label" id="recentThreads"></ul>

      <div class="sb-foot">
        <div class="status label" id="statusBox" aria-live="polite"></div>
        <button class="icon-btn" id="themeToggle" aria-label="Switch theme" data-icon="moon"></button>
      </div>
    </aside>

    <main class="main" id="main">
      <div class="mock-banner" id="mockBanner" hidden>
        <span data-icon="flask"></span>
        <span>Sample mode: answers and debates replay bundled sample data. Add a SerpApi key and turn off <code>PANCHAYAT_MOCK</code> for live answers.</span>
      </div>

      <button class="icon-btn mobile-menu" id="mobileMenu" aria-label="Open menu" data-icon="menu"></button>

      <!-- Home -->
      <section class="view home" id="homeView">
        <div class="home-tools">
          <button class="icon-btn boxed" id="themeToggleTop" aria-label="Switch theme" data-icon="moon"></button>
        </div>
        <div class="home-inner">
          <div class="eyebrow">Panchayat</div>
          <h1 class="home-title">What should the council settle?</h1>

          <form class="ask" id="homeForm" autocomplete="off">
            <textarea id="homeInput" rows="2" placeholder="Ask anything…" aria-label="Ask a question" maxlength="500"></textarea>
            <div class="ask-bar">
              <div class="ask-left">
                <span class="council-chip" id="councilChip" title="The five panches"></span>
                <div class="mode-switch" role="radiogroup" aria-label="Mode">
                  <button type="button" class="mode on" data-mode="debate" role="radio" aria-checked="true"><span data-icon="messages"></span><span>Debate</span></button>
                  <button type="button" class="mode" data-mode="council" role="radio" aria-checked="false"><span data-icon="scale"></span><span>Council</span></button>
                </div>
              </div>
              <div class="ask-right">
                <label class="pill-select" title="Answer language">
                  <select id="homeLang" aria-label="Language"></select>
                  <span data-icon="chevron-down"></span>
                </label>
                <button class="icon-btn mic" type="button" data-mic="homeInput" aria-label="Speak your question" data-icon="mic"></button>
                <button class="send" type="submit" aria-label="Ask the panchayat" data-icon="arrow-up"></button>
              </div>
            </div>
          </form>

          <div class="mode-cards">
            <button class="mode-card" type="button" data-mode="council">
              <span class="mc-title"><span data-icon="scale"></span>Ask the council</span>
              <span class="mc-text">Five AI search engines answer at once. See where they agree and where they don't.</span>
            </button>
            <button class="mode-card alt" type="button" data-mode="debate">
              <span class="mc-title"><span data-icon="messages"></span>Watch them debate <span class="new">NEW</span></span>
              <span class="mc-text">The engines cross-examine each other's answers, round by round, until they settle on one.</span>
            </button>
          </div>

          <div class="setup" id="setupCard" hidden></div>
          <div class="suggestions" id="suggestions"></div>
        </div>
      </section>

      <!-- Thread -->
      <section class="view thread" id="threadView" hidden>
        <header class="thread-head">
          <nav class="tabs" role="tablist" aria-label="Answer views">
            <button class="tab on" role="tab" data-tab="answer" aria-selected="true"><span data-icon="sparkle"></span><span>Answer</span></button>
            <button class="tab" role="tab" data-tab="links" aria-selected="false"><span data-icon="globe"></span><span>Links</span><span class="tab-count" id="linksCount"></span></button>
            <button class="tab" role="tab" data-tab="images" aria-selected="false"><span data-icon="image"></span><span>Images</span><span class="tab-count" id="imagesCount"></span></button>
          </nav>
          <div class="thread-tools">
            <button class="ghost-btn debate-toggle" id="councilToggle" aria-controls="councilPanel" aria-expanded="false"><span data-icon="messages"></span><span>Debate</span></button>
            <button class="share-btn" id="copyThread"><span data-icon="share"></span><span>Copy</span></button>
          </div>
        </header>
        <div class="thread-body">
          <div class="thread-scroll" id="threadScroll">
            <div class="turns" id="turns"></div>
            <div class="tab-pane" id="linksPane" hidden></div>
            <div class="tab-pane" id="imagesPane" hidden></div>
            <div class="composer-spacer"></div>
          </div>
          <aside class="council" id="councilPanel" aria-label="The debate between the panches">
            <button class="icon-btn council-close" id="councilClose" aria-label="Close" data-icon="x"></button>
            <div id="councilContent"></div>
          </aside>
        </div>
        <form class="ask followup" id="followForm" autocomplete="off">
          <textarea id="followInput" rows="1" placeholder="Ask a follow-up" aria-label="Ask a follow-up" maxlength="500"></textarea>
          <div class="ask-bar">
            <div class="ask-left">
              <div class="mode-switch small" role="radiogroup" aria-label="Mode">
                <button type="button" class="mode on" data-mode="debate" role="radio" aria-checked="true"><span data-icon="messages"></span><span>Debate</span></button>
                <button type="button" class="mode" data-mode="council" role="radio" aria-checked="false"><span data-icon="scale"></span><span>Council</span></button>
              </div>
            </div>
            <div class="ask-right">
              <label class="pill-select" title="Answer language">
                <select id="followLang" aria-label="Language"></select>
                <span data-icon="chevron-down"></span>
              </label>
              <button class="icon-btn mic" type="button" data-mic="followInput" aria-label="Speak your question" data-icon="mic"></button>
              <button class="send" type="submit" id="followSend" aria-label="Send" data-icon="arrow-up"></button>
            </div>
          </div>
        </form>
      </section>

      <!-- Library -->
      <section class="view library" id="libraryView" hidden>
        <div class="library-inner">
          <div class="library-head">
            <h2><span data-icon="library"></span> Library</h2>
            <input type="search" id="librarySearch" placeholder="Search your threads" aria-label="Search threads" />
          </div>
          <ul class="library-list" id="libraryList"></ul>
        </div>
      </section>
    </main>
  </div>

  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
  <div class="scrim" id="scrim" hidden></div>
  <script type="module" src="assets/app.js"></script>
</body>
</html>
